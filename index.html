        chooseRarity();


    const available =
        fruits.filter(
            fruit =>
                fruit.rarity ===
                rarity
        );


    return available[
        Math.floor(
            Math.random() *
            available.length
        )
    ];

}


/* =====================================================
   CRIAR CARTA
===================================================== */

function createCard(fruit) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "fruit-card " +
        fruit.rarity.toLowerCase();


    card.innerHTML = `

        <img
            src="${fruit.image}"
            alt="${fruit.name}"
            onerror="
                this.src='https://placehold.co/210x205/111/fff?text=${fruit.name}'
            "
        >

        <div class="name">

            ${fruit.name}

        </div>

        <div class="rarity">

            ${fruit.rarityPT}

        </div>

    `;


    return card;

}


/* =====================================================
   MONTAR ROLETA
===================================================== */

function buildRoulette() {

    track.innerHTML =
        "";


    for (
        let round = 0;
        round < 12;
        round++
    ) {

        const shuffled =
            [...fruits]
                .sort(
                    () =>
                        Math.random() - .5
                );


        shuffled.forEach(
            fruit => {

                track.appendChild(
                    createCard(
                        fruit
                    )
                );

            }
        );

    }


    track.style.transform =
        "translateX(0px)";

}


buildRoulette();


/* =====================================================
   GIRO
===================================================== */

function spin() {

    if (
        spinButton.disabled
    ) {

        return;

    }


    if (
        spins <= 0
    ) {

        alert(
            "Você não tem mais giros!"
        );

        return;

    }


    spins--;

    save();


    spinButton.disabled =
        true;


    spinCount.textContent =
        spins;


    result.innerHTML =
        "🎰 Girando...";


    /*
        Escolhemos a fruta
        antes da animação.
    */

    const winner =
        chooseFruit();


    /*
        Criamos uma nova sequência.
    */

    track.innerHTML =
        "";


    const sequence = [];


    for (
        let i = 0;
        i < 70;
        i++
    ) {

        sequence.push(
            fruits[
                Math.floor(
                    Math.random() *
                    fruits.length
                )
            ]
        );

    }


    /*
        Posição da fruta vencedora.
    */

    const winnerIndex =
        58;


    sequence[
        winnerIndex
    ] = winner;


    sequence.forEach(
        fruit => {

            track.appendChild(
                createCard(
                    fruit
                )
            );

        }
    );


    /*
        =================================================
        CORREÇÃO RESPONSIVA
        =================================================

        Em vez de assumir que cada carta possui
        270px, pegamos o tamanho REAL da carta
        que está sendo exibida.

        Isso faz funcionar tanto no PC quanto
        no celular.
    */

    const cards =
        track.children;


    const winningCard =
        cards[
            winnerIndex
        ];


    /*
        Largura real da carta.
    */

    const cardWidth =
        winningCard.offsetWidth;


    /*
        Espaçamento real entre as cartas.
    */

    const trackStyle =
        getComputedStyle(track);


    const gap =
        parseFloat(
            trackStyle.gap
        ) || 0;


    const step =
        cardWidth +
        gap;


    /*
        Centro da tela.
    */

    const viewportCenter =
        window.innerWidth / 2;


    /*
        Centro da carta vencedora.
    */

    const cardCenter =
        winnerIndex *
        step +
        cardWidth / 2;


    /*
        Pequena variação aleatória
        para deixar o giro menos repetitivo.
    */

    const variation =
        Math.floor(
            Math.random() * 40
        ) - 20;


    /*
        Posição final.
    */

    const finalPosition =
        viewportCenter -
        cardCenter +
        variation;


    /*
        Começa sem transição.
    */

    track.style.transition =
        "none";


    track.style.transform =
        "translateX(0px)";


    /*
        Força atualização do navegador.
    */

    track.offsetHeight;


    /*
        GIRO!
    */

    track.style.transition =
        "transform 5.5s cubic-bezier(.08,.72,.12,1)";


    track.style.transform =
        `translateX(${finalPosition}px)`;


    /*
        Quando terminar...
    */

    setTimeout(
        () => {

            finishSpin(
                winner
            );

        },
        5600
    );

}


/* =====================================================
   FINAL DO GIRO
===================================================== */

function finishSpin(
    winner
) {

    spinButton.disabled =
        false;


    result.innerHTML = `

        🎉 Você conseguiu:

        <span
            style="
                color:${getRarityColor(
                    winner.rarity
                )};
            "
        >

            ${winner.name}

        </span>

        — ${winner.rarityPT}

    `;


    /*
        INVENTÁRIO
    */

    if (
        !owned[winner.name]
    ) {

        owned[winner.name] =
            {

                fruit:
                    winner,

                amount:
                    0

            };

    }


    owned[
        winner.name
    ].amount++;


    /*
        HISTÓRICO
    */

    historyList.unshift(
        winner
    );


    if (
        historyList.length > 12
    ) {

        historyList.pop();

    }


    save();

    renderInventory();

    renderHistory();

}


/* =====================================================
   CORES
===================================================== */

function getRarityColor(
    rarity
) {

    switch (
        rarity
    ) {

        case "Common":
            return "#ddd";

        case "Uncommon":
            return "#58a6ff";

        case "Rare":
            return "#bd70ff";

        case "Legendary":
            return "#ffab48";

        case "Mythical":
            return "#ff3f48";

        default:
            return "#fff";

    }

}


/* =====================================================
   INVENTÁRIO
===================================================== */

function renderInventory() {

    inventory.innerHTML =
        "";


    const items =
        Object.values(
            owned
        );


    if (
        items.length === 0
    ) {

        inventory.innerHTML = `

            <p
                style="
                    color:#888;
                "
            >

                Nenhuma fruta ainda.

            </p>

        `;

        return;

    }


    items.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "inventory-item";


            div.innerHTML = `

                <img
                    src="${item.fruit.image}"
                    alt="${item.fruit.name}"
                >

                <strong>

                    ${item.fruit.name}

                </strong>

                <small>

                    x${item.amount}

                </small>

            `;


            inventory.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   HISTÓRICO
===================================================== */

function renderHistory() {

    history.innerHTML =
        "";


    if (
        historyList.length === 0
    ) {

        history.innerHTML = `

            <p
                style="
                    color:#888;
                "
            >

                Nenhum giro ainda.

            </p>

        `;

        return;

    }


    historyList.forEach(
        fruit => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.innerHTML = `

                <div
                    class="history-left"
                >

                    <img
                        src="${fruit.image}"
                        alt="${fruit.name}"
                    >

                    <strong>

                        ${fruit.name}

                    </strong>

                </div>


                <span
                    style="
                        color:${getRarityColor(
                            fruit.rarity
                        )};
                        font-weight:bold;
                    "
                >

                    ${fruit.rarityPT}

                </span>

            `;


            history.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SALVAR
===================================================== */

function save() {

    localStorage.setItem(
        "bloxGachaSpins",
        spins
    );


    localStorage.setItem(
        "bloxGachaInventory",
        JSON.stringify(
            owned
        )
    );


    localStorage.setItem(
        "bloxGachaHistory",
        JSON.stringify(
            historyList
        )
    );

}


/* =====================================================
   RESET
===================================================== */

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !confirm(
                    "Apagar todo o progresso?"
                )
            ) {

                return;

            }


            spins = 10;

            owned = {};

            historyList = [];


            save();


            spinCount.textContent =
                spins;


            renderInventory();

            renderHistory();


            result.innerHTML =
                "";

        }
    );


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

spinCount.textContent =
    spins;

renderInventory();

renderHistory();


/* =====================================================
   BOTÃO GIRAR
===================================================== */

spinButton.addEventListener(
    "click",
    spin
);

</script>

</body>

</html>
