
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blox Fruits Gacha</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 35%,
            #24143a 0%,
            #090712 35%,
            #020207 75%
        );

    overflow-x: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {

    min-height: 90px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 40px;

    background:
        rgba(0,0,0,.55);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}


.logo {

    font-size: 27px;

    font-weight: 900;
}


.logo span {

    color: #d45cff;
}


.spins {

    padding:
        11px 20px;

    border-radius:
        30px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.15);

    font-weight: bold;
}


/* =====================================================
   TÍTULO
===================================================== */

.title {

    text-align: center;

    padding:
        45px 20px 30px;
}


.title h1 {

    font-size:
        clamp(40px,6vw,70px);

    font-weight: 900;

    letter-spacing: 1px;

    color: #d27be9;

    text-shadow:
        0 0 25px
        rgba(210,123,233,.3);
}


.title p {

    margin-top: 10px;

    color: #aaa6b8;
}


/* =====================================================
   ROLETA
===================================================== */

.roulette-wrapper {

    position: relative;

    width: 100%;

    margin-top: 20px;
}


.roulette-wrapper::before,
.roulette-wrapper::after {

    content: "";

    position: absolute;

    left: 0;

    width: 100%;

    height: 70px;

    z-index: 5;

    pointer-events: none;
}


.roulette-wrapper::before {

    top: -1px;

    background:
        linear-gradient(
            to bottom,
            #000 0%,
            rgba(30,15,35,.7) 55%,
            transparent
        );
}


.roulette-wrapper::after {

    bottom: -1px;

    background:
        linear-gradient(
            to top,
            #000 0%,
            rgba(30,15,35,.7) 55%,
            transparent
        );
}


.roulette {

    position: relative;

    width: 100%;

    height: 330px;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            rgba(140,72,147,.25),
            rgba(0,0,0,.5),
            rgba(140,72,147,.25)
        );

    border-top:
        8px solid
        #80527f;

    border-bottom:
        8px solid
        #80527f;

    box-shadow:
        0 0 35px
        rgba(206,110,210,.25),

        inset 0 0 40px
        rgba(0,0,0,.8);
}


/* =====================================================
   LINHA DE FRUTAS
===================================================== */

.roulette-track {

    position: absolute;

    top: 25px;

    left: 0;

    height: 270px;

    display: flex;

    align-items: center;

    gap: 18px;

    will-change: transform;
}


/* =====================================================
   CARTAS
===================================================== */

.fruit-card {

    flex:
        0 0 270px;

    height: 300px;

    position: relative;

    border-radius: 15px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    align-items: center;

    padding:
        15px 10px 12px;

    background: #182943;

    border:
        2px solid
        rgba(0,0,0,.65);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.45);
}


/* =====================================================
   CORES DAS CARTAS
===================================================== */

.fruit-card.common {

    background:
        linear-gradient(
            #464646,
            #161616
        );
}


.fruit-card.uncommon {

    background:
        linear-gradient(
            #304a70,
            #101d31
        );
}


.fruit-card.rare {

    background:
        linear-gradient(
            #55337b,
            #160e25
        );
}


.fruit-card.legendary {

    background:
        linear-gradient(
            #7b481d,
            #211307
        );
}


.fruit-card.mythical {

    background:
        linear-gradient(
            #821f26,
            #220609
        );
}


/* =====================================================
   IMAGEM
===================================================== */

.fruit-card img {

    width: 210px;

    height: 205px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 8px
            rgba(0,0,0,.55)
        );
}


/* =====================================================
   NOME
===================================================== */

.fruit-card .name {

    font-size: 30px;

    font-weight: 900;

    text-align: center;

    text-shadow:
        2px 3px 3px #000;
}


/* =====================================================
   RARIDADE
===================================================== */

.fruit-card .rarity {

    font-size: 18px;

    font-weight: 900;

    text-shadow:
        2px 2px 3px #000;
}


.common .rarity {
    color: #ddd;
}


.uncommon .rarity {
    color: #58a6ff;
}


.rare .rarity {
    color: #bd70ff;
}


.legendary .rarity {
    color: #ffab48;
}


.mythical .rarity {
    color: #ff3f48;
}


/* =====================================================
   SETAS
===================================================== */

.pointer-top {

    position: absolute;

    top: -4px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    width: 0;

    height: 0;

    border-left: 25px solid transparent;

    border-right: 25px solid transparent;

    border-top: 30px solid #ffd92f;

    filter:
        drop-shadow(
            0 2px 0 #000
        );
}


.pointer-bottom {

    position: absolute;

    bottom: -4px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    width: 0;

    height: 0;

    border-left: 25px solid transparent;

    border-right: 25px solid transparent;

    border-bottom: 30px solid #ffd92f;

    filter:
        drop-shadow(
            0 -2px 0 #000
        );
}


/* =====================================================
   BOTÃO
===================================================== */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    margin: 35px 20px;
}


.spin-button {

    padding:
        17px 60px;

    border: none;

    border-radius: 14px;

    font-size: 21px;

    font-weight: 900;

    color: #111;

    background:
        linear-gradient(
            135deg,
            #ffe45a,
            #ff9c1a
        );

    cursor: pointer;

    box-shadow:
        0 10px 35px
        rgba(255,170,0,.35);

    transition: .2s;
}


.spin-button:hover {

    transform:
        translateY(-3px)
        scale(1.03);
}


.spin-button:disabled {

    opacity: .5;

    cursor: not-allowed;
}


/* =====================================================
   RESULTADO
===================================================== */

.result {

    text-align: center;

    min-height: 45px;

    padding: 0 15px;
}


.result span {

    font-weight: 900;
}


/* =====================================================
   PAINÉIS
===================================================== */

.panels {

    width:
        min(1100px,92%);

    margin:
        40px auto;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 25px;
}


.panel {

    padding: 25px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.08);
}


.panel h2 {

    margin-bottom: 20px;
}


/* =====================================================
   INVENTÁRIO
===================================================== */

.inventory {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(100px,1fr)
        );

    gap: 10px;
}


.inventory-item {

    padding: 10px;

    text-align: center;

    border-radius: 12px;

    background:
        rgba(255,255,255,.05);
}


.inventory-item img {

    width: 65px;

    height: 65px;

    object-fit: contain;
}


.inventory-item strong {

    display: block;

    font-size: 13px;
}


.inventory-item small {

    color: #aaa;
}


/* =====================================================
   HISTÓRICO
===================================================== */

.history {

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.history-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 12px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.04);
}


.history-left {

    display: flex;

    align-items: center;

    gap: 10px;
}


.history-left img {

    width: 45px;

    height: 45px;

    object-fit: contain;
}


/* =====================================================
   RESET
===================================================== */

.reset {

    display: block;

    margin: 30px auto;

    padding: 10px 20px;

    border:
        1px solid
        rgba(255,255,255,.15);

    background: transparent;

    color: #aaa;

    border-radius: 10px;

    cursor: pointer;
}


.reset:hover {

    color: white;
}


/* =====================================================
   TELA DE RECOMPENSA
===================================================== */

.reward-overlay {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.82);

    backdrop-filter:
        blur(8px);
}


.reward-overlay.show {

    display: flex;

    animation:
        overlayIn .35s ease;
}


@keyframes overlayIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* =====================================================
   CAIXA DA RECOMPENSA
===================================================== */

.reward-box {

    width:
        min(500px, 95vw);

    min-height: 550px;

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 40px 25px;

    border-radius: 28px;

    overflow: hidden;

    border: 3px solid var(--rarity-color);

    background:
        radial-gradient(
            circle at center,
            var(--rarity-bg),
            #08070c 72%
        );

    box-shadow:
        0 0 25px var(--rarity-color),
        0 0 80px var(--rarity-color),
        inset 0 0 60px rgba(255,255,255,.05);

    animation:
        rewardAppear .65s
        cubic-bezier(.17,.89,.32,1.28);
}


@keyframes rewardAppear {

    0% {

        transform:
            scale(.3)
            rotate(-8deg);

        opacity: 0;

    }

    70% {

        transform:
            scale(1.05)
            rotate(2deg);

    }

    100% {

        transform:
            scale(1)
            rotate(0);

        opacity: 1;

    }
}


/* =====================================================
   BRILHO ATRÁS DA FRUTA
===================================================== */

.reward-box::before {

    content: "";

    position: absolute;

    width: 280px;

    height: 280px;

    border-radius: 50%;

    background:
        var(--rarity-color);

    filter: blur(90px);

    opacity: .45;

    animation:
        glowPulse 1.5s
        infinite alternate;
}


@keyframes glowPulse {

    from {
        transform: scale(.8);
        opacity: .3;
    }

    to {
        transform: scale(1.2);
        opacity: .6;
    }
}


/* =====================================================
   TEXTO "VOCÊ GANHOU"
===================================================== */

.reward-title {

    position: relative;

    z-index: 2;

    font-size:
        clamp(28px,6vw,42px);

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-bottom: 15px;

    text-shadow:
        0 3px 5px #000;
}


.reward-subtitle {

    position: relative;

    z-index: 2;

    color: #aaa;

    font-size: 16px;

    margin-bottom: 10px;
}


/* =====================================================
   IMAGEM DA FRUTA GANHA
===================================================== */

.reward-image {

    position: relative;

    z-index: 2;

    width:
        min(300px,75vw);

    height:
        280px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 15px
            var(--rarity-color)
        )

        drop-shadow(
            0 20px 20px
            rgba(0,0,0,.8)
        );

    animation:
        fruitFloat 2s
        ease-in-out
        infinite;
}


@keyframes fruitFloat {

    0%,
    100% {

        transform:
            translateY(0)
            scale(1);

    }

    50% {

        transform:
            translateY(-12px)
            scale(1.04);

    }
}


/* =====================================================
   NOME DA FRUTA
===================================================== */

.reward-name {

    position: relative;

    z-index: 2;

    font-size:
        clamp(32px,8vw,52px);

    font-weight: 900;

    margin-top: 5px;

    text-shadow:
        0 0 12px var(--rarity-color),
        3px 4px 4px #000;
}


/* =====================================================
   RARIDADE DA RECOMPENSA
===================================================== */

.reward-rarity {

    position: relative;

    z-index: 2;

    margin-top: 8px;

    font-size: 23px;

    font-weight: 900;

    color: var(--rarity-color);

    text-shadow:
        0 0 10px var(--rarity-color),
        2px 2px 3px #000;
}


/* =====================================================
   BOTÃO CONTINUAR
===================================================== */

.reward-button {

    position: relative;

    z-index: 2;

    margin-top: 28px;

    padding:
        14px 45px;

    border: 2px solid var(--rarity-color);

    border-radius: 12px;

    color: white;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    background:
        rgba(0,0,0,.45);

    box-shadow:
        0 0 15px
        var(--rarity-color);

    transition: .2s;
}


.reward-button:hover {

    transform:
        scale(1.06);

    background:
        var(--rarity-color);

    color: #000;

    box-shadow:
        0 0 30px
        var(--rarity-color);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 800px) {

    header {

        min-height: 70px;

        padding: 0 15px;

        gap: 10px;
    }


    .logo {

        font-size: 19px;

        white-space: nowrap;
    }


    .spins {

        font-size: 13px;

        padding: 8px 12px;

        white-space: nowrap;
    }


    .title {

        padding:
            35px 15px 25px;
    }


    .title h1 {

        font-size:
            clamp(
                32px,
                10vw,
                50px
            );
    }


    .title p {

        font-size: 14px;
    }


    .roulette {

        height: 300px;
    }


    .roulette-track {

        top: 20px;

        height: 260px;

        gap: 12px;
    }


    .fruit-card {

        flex:
            0 0 210px;

        height: 260px;

        padding:
            12px 8px 10px;
    }


    .fruit-card img {

        width: 160px;

        height: 170px;
    }


    .fruit-card .name {

        font-size: 24px;
    }


    .fruit-card .rarity {

        font-size: 16px;
    }


    .pointer-top,
    .pointer-bottom {

        border-left-width: 20px;

        border-right-width: 20px;
    }


    .pointer-top {

        border-top-width: 25px;
    }


    .pointer-bottom {

        border-bottom-width: 25px;
    }


    .controls {

        margin:
            30px 15px;
    }


    .spin-button {

        width:
            min(100%,320px);

        padding:
            15px 30px;

        font-size: 19px;
    }


    .panels {

        width:
            calc(100% - 30px);

        grid-template-columns:
            1fr;

        gap: 15px;

        margin:
            30px auto;
    }


    .panel {

        padding: 20px;
    }


    .inventory {

        grid-template-columns:
            repeat(
                auto-fill,
                minmax(85px,1fr)
            );
    }


    .reward-box {

        min-height: 500px;

        padding:
            30px 20px;

        border-radius: 22px;
    }


    .reward-image {

        width: 260px;

        height: 240px;
    }


    .reward-title {

        font-size: 29px;
    }


    .reward-rarity {

        font-size: 20px;
    }


    .reward-button {

        margin-top: 20px;

        padding:
            13px 38px;
    }

}


/* =====================================================
   CELULARES MUITO PEQUENOS
===================================================== */

@media (max-width: 400px) {

    header {

        padding: 0 10px;
    }


    .logo {

        font-size: 16px;
    }


    .spins {

        font-size: 11px;

        padding:
            7px 9px;
    }


    .fruit-card {

        flex-basis: 190px;
    }


    .fruit-card img {

        width: 145px;

        height: 155px;
    }


    .fruit-card .name {

        font-size: 21px;
    }


    .reward-box {

        min-height: 460px;
    }


    .reward-image {

        width: 220px;

        height: 210px;
    }


    .reward-name {

        font-size: 36px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">

        🍎 BLOX
        <span>GACHA</span>

    </div>


    <div class="spins">

        🎰 Giros:
        <span id="spinCount">10</span>

    </div>

</header>


<section class="title">

    <h1>
        Blox Fruits Gacha
    </h1>

    <p>
        Gire a roleta e descubra sua fruta!
    </p>

</section>


<!-- =====================================================
     ROLETA
===================================================== -->

<div class="roulette-wrapper">

    <div class="roulette">

        <div class="pointer-top"></div>

        <div
            class="roulette-track"
            id="rouletteTrack"
        ></div>

        <div class="pointer-bottom"></div>

    </div>

</div>


<!-- =====================================================
     BOTÃO GIRAR
===================================================== -->

<div class="controls">

    <button
        class="spin-button"
        id="spinButton"
    >

        🎰 GIRAR

    </button>

</div>


<div
    class="result"
    id="result"
></div>


<!-- =====================================================
     PAINÉIS
===================================================== -->

<section class="panels">

    <div class="panel">

        <h2>
            🎒 Inventário
        </h2>

        <div
            class="inventory"
            id="inventory"
        ></div>

    </div>


    <div class="panel">

        <h2>
            📜 Histórico
        </h2>

        <div
            class="history"
            id="history"
        ></div>

    </div>

</section>


<button
    class="reset"
    id="resetButton"
>

    🔄 Resetar progresso

</button>


<!-- =====================================================
     TELA DE RECOMPENSA
===================================================== -->

<div
    class="reward-overlay"
    id="rewardOverlay"
>

    <div
        class="reward-box"
        id="rewardBox"
    >

        <div class="reward-title">

            🎉 VOCÊ GANHOU!

        </div>


        <div class="reward-subtitle">

            Você conseguiu uma fruta:

        </div>


        <img
            class="reward-image"
            id="rewardImage"
            src=""
            alt=""
        >


        <div
            class="reward-name"
            id="rewardName"
        ></div>


        <div
            class="reward-rarity"
            id="rewardRarity"
        ></div>


        <button
            class="reward-button"
            id="rewardButton"
        >

            CONTINUAR

        </button>

    </div>

</div>


<script>

/* =====================================================
   FRUTAS
===================================================== */

const fruits = [



    {
        name: "Tiger",
        image: "img/Tiger.webp",
        rarity: "Mythical",
        rarityPT: "Mítica"
    },

    {
        name: "Yeti",
        image: "img/Yeti.webp",
        rarity: "Mythical",
        rarityPT: "Mítica"
    },

    {
        name: "Kitsune",
        image: "img/Kitsune.webp",
        rarity: "Mythical",
        rarityPT: "Mítica"
    },

    {
        name: "Control",
        image: "img/Control.webp",
        rarity: "Mythical",
        rarityPT: "Mítica"
    },

    {
        name: "Dragon(Eart)",
        image: "img/Dragon.webp",
        rarity: "Mythical",
        rarityPT: "Mítica"
    },

    {
        name: "Dragon(West)",
        image: "img/Dragon (2).webp",
        rarity: "Mythical",
        rarityPT: "Mítica"
    },

    {
        name: "Magnet",
        image: "img/Magnet.webp",
        rarity: "Mythical",
        rarityPT: "Mítica"
    }

];


/* =====================================================
   CHANCES
===================================================== */

const chances = {

    Common: ,

    Uncommon: ,

    Rare: ,

    Legendary: ,

    Mythical: 100

};


/* =====================================================
   ELEMENTOS
===================================================== */

const track =
    document.getElementById(
        "rouletteTrack"
    );

const spinButton =
    document.getElementById(
        "spinButton"
    );

const spinCount =
    document.getElementById(
        "spinCount"
    );

const result =
    document.getElementById(
        "result"
    );

const inventory =
    document.getElementById(
        "inventory"
    );

const history =
    document.getElementById(
        "history"
    );


/* =====================================================
   ELEMENTOS DA RECOMPENSA
===================================================== */

const rewardOverlay =
    document.getElementById(
        "rewardOverlay"
    );

const rewardBox =
    document.getElementById(
        "rewardBox"
    );

const rewardImage =
    document.getElementById(
        "rewardImage"
    );

const rewardName =
    document.getElementById(
        "rewardName"
    );

const rewardRarity =
    document.getElementById(
        "rewardRarity"
    );

const rewardButton =
    document.getElementById(
        "rewardButton"
    );


/* =====================================================
   ESTADO
===================================================== */

let spins =
    Number(
        localStorage.getItem(
            "bloxGachaSpins"
        )
    ) || 10;


let owned =
    JSON.parse(
        localStorage.getItem(
            "bloxGachaInventory"
        )
    ) || {};


let historyList =
    JSON.parse(
        localStorage.getItem(
            "bloxGachaHistory"
        )
    ) || [];


/* =====================================================
   ESCOLHER RARIDADE
===================================================== */

function chooseRarity() {

    const random =
        Math.random() * 100;

    let total = 0;

    for (
        const rarity in chances
    ) {

        total +=
            chances[rarity];

        if (
            random <= total
        ) {

            return rarity;

        }

    }

    return "Common";

}


/* =====================================================
   ESCOLHER FRUTA
===================================================== */

function chooseFruit() {

    const rarity =
        chooseRarity();

    const available =
        fruits.filter(
            fruit =>
                fruit.rarity ===
                rarity
        );

    return available[
        Math.floor(
            Math.random() *
            available.length
        )
    ];

}


/* =====================================================
   CRIAR CARTA
===================================================== */

function createCard(fruit) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "fruit-card " +
        fruit.rarity.toLowerCase();

    card.innerHTML = `

        <img
            src="${fruit.image}"
            alt="${fruit.name}"
            onerror="
                this.src='https://placehold.co/210x205/111/fff?text=${fruit.name}'
            "
        >

        <div class="name">
            ${fruit.name}
        </div>

        <div class="rarity">
            ${fruit.rarityPT}
        </div>

    `;

    return card;

}


/* =====================================================
   MONTAR ROLETA
===================================================== */

function buildRoulette() {

    track.innerHTML = "";

    for (
        let round = 0;
        round < 12;
        round++
    ) {

        const shuffled =
            [...fruits]
                .sort(
                    () =>
                        Math.random() - .5
                );

        shuffled.forEach(
            fruit => {

                track.appendChild(
                    createCard(fruit)
                );

            }
        );

    }

    track.style.transform =
        "translateX(0px)";

}


buildRoulette();


/* =====================================================
   GIRO
===================================================== */

function spin() {

    if (
        spinButton.disabled
    ) {

        return;

    }


    if (
        spins <= 0
    ) {

        alert(
            "Você não tem mais giros!"
        );

        return;

    }


    spins--;

    save();

    spinButton.disabled =
        true;

    spinCount.textContent =
        spins;

    result.innerHTML =
        "🎰 Girando...";


    /*
        Escolhe a fruta antes
        da animação.
    */

    const winner =
        chooseFruit();


    /*
        Nova sequência.
    */

    track.innerHTML =
        "";

    const sequence = [];


    for (
        let i = 0;
        i < 70;
        i++
    ) {

        sequence.push(
            fruits[
                Math.floor(
                    Math.random() *
                    fruits.length
                )
            ]
        );

    }


    /*
        Posição da vencedora.
    */

    const winnerIndex =
        58;


    sequence[
        winnerIndex
    ] = winner;


    sequence.forEach(
        fruit => {

            track.appendChild(
                createCard(fruit)
            );

        }
    );


    /* =================================================
       CALCULAR POSIÇÃO EXATA
    ================================================= */

    const cards =
        track.children;

    const winningCard =
        cards[winnerIndex];


    track.style.transition =
        "none";

    track.style.transform =
        "translateX(0px)";


    track.offsetHeight;


    const cardRect =
        winningCard.getBoundingClientRect();


    const cardCenter =
        cardRect.left +
        cardRect.width / 2;


    const roulette =
        document.querySelector(
            ".roulette"
        );


    const rouletteRect =
        roulette.getBoundingClientRect();


    const rouletteCenter =
        rouletteRect.left +
        rouletteRect.width / 2;


    let finalPosition =
        rouletteCenter -
        cardCenter;


    const variation =
        Math.floor(
            Math.random() * 20
        ) - 10;


    finalPosition +=
        variation;


    /* =================================================
       ANIMAÇÃO
    ================================================= */

    requestAnimationFrame(
        () => {

            track.style.transition =
                "transform 5.5s cubic-bezier(.08,.72,.12,1)";

            track.style.transform =
                `translateX(${finalPosition}px)`;

        }
    );


    /*
        Depois que a roleta terminar,
        mostra a recompensa.
    */

    setTimeout(
        () => {

            finishSpin(
                winner
            );

        },
        5600
    );

}


/* =====================================================
   MOSTRAR RECOMPENSA
===================================================== */

function showReward(winner) {

    const colors = {

        Common: {
            color: "#ddd",
            bg: "rgba(100,100,100,.45)"
        },

        Uncommon: {
            color: "#58a6ff",
            bg: "rgba(40,100,190,.45)"
        },

        Rare: {
            color: "#bd70ff",
            bg: "rgba(120,40,190,.45)"
        },

        Legendary: {
            color: "#ffab48",
            bg: "rgba(190,90,20,.45)"
        },

        Mythical: {
            color: "#ff3f48",
            bg: "rgba(190,20,30,.45)"
        }

    };


    const rarity =
        colors[
            winner.rarity
        ] || colors.Common;


    rewardBox.style
        .setProperty(
            "--rarity-color",
            rarity.color
        );


    rewardBox.style
        .setProperty(
            "--rarity-bg",
            rarity.bg
        );


    rewardImage.src =
        winner.image;

    rewardImage.alt =
        winner.name;


    rewardName.textContent =
        winner.name;


    rewardRarity.textContent =
        winner.rarityPT;


    rewardOverlay.classList
        .add("show");

}


/* =====================================================
   FECHAR RECOMPENSA
===================================================== */

rewardButton.addEventListener(
    "click",
    () => {

        rewardOverlay.classList
            .remove("show");

    }
);


/* =====================================================
   FINAL DO GIRO
===================================================== */

function finishSpin(winner) {

    spinButton.disabled =
        false;


    result.innerHTML = `

        🎉 Você conseguiu:

        <span
            style="
                color:${getRarityColor(
                    winner.rarity
                )};
            "
        >

            ${winner.name}

        </span>

        — ${winner.rarityPT}

    `;


    /* =================================================
       INVENTÁRIO
    ================================================= */

    if (
        !owned[winner.name]
    ) {

        owned[winner.name] = {

            fruit:
                winner,

            amount:
                0

        };

    }


    owned[
        winner.name
    ].amount++;


    /* =================================================
       HISTÓRICO
    ================================================= */

    historyList.unshift(
        winner
    );


    if (
        historyList.length > 12
    ) {

        historyList.pop();

    }


    save();

    renderInventory();

    renderHistory();


    /*
        MOSTRA A TELA ESPECIAL
    */

    showReward(
        winner
    );

}


/* =====================================================
   CORES
===================================================== */

function getRarityColor(rarity) {

    switch (rarity) {

        case "Common":
            return "#ddd";

        case "Uncommon":
            return "#58a6ff";

        case "Rare":
            return "#bd70ff";

        case "Legendary":
            return "#ffab48";

        case "Mythical":
            return "#ff3f48";

        default:
            return "#fff";

    }

}


/* =====================================================
   INVENTÁRIO
===================================================== */

function renderInventory() {

    inventory.innerHTML =
        "";

    const items =
        Object.values(
            owned
        );


    if (
        items.length === 0
    ) {

        inventory.innerHTML = `

            <p
                style="
                    color:#888;
                "
            >

                Nenhuma fruta ainda.

            </p>

        `;

        return;

    }


    items.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "inventory-item";


            div.innerHTML = `

                <img
                    src="${item.fruit.image}"
                    alt="${item.fruit.name}"
                >

                <strong>
                    ${item.fruit.name}
                </strong>

                <small>
                    x${item.amount}
                </small>

            `;


            inventory.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   HISTÓRICO
===================================================== */

function renderHistory() {

    history.innerHTML =
        "";


    if (
        historyList.length === 0
    ) {

        history.innerHTML = `

            <p
                style="
                    color:#888;
                "
            >

                Nenhum giro ainda.

            </p>

        `;

        return;

    }


    historyList.forEach(
        fruit => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "history-item";


            div.innerHTML = `

                <div
                    class="history-left"
                >

                    <img
                        src="${fruit.image}"
                        alt="${fruit.name}"
                    >

                    <strong>
                        ${fruit.name}
                    </strong>

                </div>

                <span
                    style="
                        color:${getRarityColor(
                            fruit.rarity
                        )};
                        font-weight:bold;
                    "
                >

                    ${fruit.rarityPT}

                </span>

            `;


            history.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   SALVAR
===================================================== */

function save() {

    localStorage.setItem(
        "bloxGachaSpins",
        spins
    );


    localStorage.setItem(
        "bloxGachaInventory",
        JSON.stringify(
            owned
        )
    );


    localStorage.setItem(
        "bloxGachaHistory",
        JSON.stringify(
            historyList
        )
    );

}


/* =====================================================
   RESET
===================================================== */

document
    .getElementById(
        "resetButton"
    )
    .addEventListener(
        "click",
        () => {

            if (
                !confirm(
                    "Apagar todo o progresso?"
                )
            ) {

                return;

            }


            spins = 10;

            owned = {};

            historyList = [];


            save();


            spinCount.textContent =
                spins;


            renderInventory();

            renderHistory();


            result.innerHTML =
                "";

        }
    );


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

spinCount.textContent =
    spins;

renderInventory();

renderHistory();


/* =====================================================
   BOTÃO GIRAR
===================================================== */

spinButton.addEventListener(
    "click",
    spin
);

</script>

</body>

</html>
